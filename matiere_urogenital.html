<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagerie de l'appareil uro-génital</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#382820;font-family:Arial,sans-serif}header{padding:20px 5vw;border-bottom:1px solid #ddd0c0;display:flex;align-items:center;position:sticky;top:0;background:#f4efe6ee;backdrop-filter:blur(12px);z-index:5}.brand{font:700 20px Georgia}.meta{margin-left:auto;color:#8b796c;font-size:12px}main{max-width:1180px;margin:auto;padding:48px 22px 90px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8b796c}h1{font:400 clamp(40px,7vw,72px)/1 Georgia;margin:10px 0 14px}.lead{color:#8b796c;max-width:650px;line-height:1.7;margin-bottom:38px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fbf8f2;border:1px solid #ddd0c0;border-radius:25px;min-height:245px;padding:25px;position:relative;transition:.2s}.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px #4a302518}.icon{font-size:40px;margin-bottom:auto}.card h2{font:400 25px Georgia;margin:30px 0 8px}.card p{color:#8b796c;font-size:13px;line-height:1.5;margin:0;padding-right:22px}.badge{position:absolute;right:18px;top:18px;background:#e9ded0;border-radius:999px;padding:6px 9px;font-size:10px;color:#8b796c}.arrow{position:absolute;right:22px;bottom:20px;font-size:20px}.back{text-decoration:none;color:#8b796c;font-size:13px}.empty{background:#fbf8f2;border:1px dashed #cdbbaa;border-radius:22px;padding:40px;text-align:center;color:#8b796c}@media(max-width:850px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.gallery{grid-template-columns:1fr}.card{min-height:210px}}</style></head><body><header><a class="back" href="index.html">← Accueil</a><div class="meta">my study space ♡</div></header><main><div class="eyebrow">matière · 0 chapitre</div><h1>🩻 Imagerie de l'appareil uro-génital</h1><p class="lead">Choisis un chapitre pour commencer ta révision.</p><div class="empty">Aucun chapitre pour le moment ♡</div></main></body></html>
